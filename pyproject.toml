[project]
name = "audiobook-pipeline"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.28",
    "loguru>=0.7",
    "openai>=2.0",
    "rapidfuzz>=3.0",
    "pydantic-settings[toml]>=2.14",
    "psutil>=7.2.2",
]

[project.scripts]
audiobook-convert = "audiobook_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobook_pipeline"]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-httpx>=0.36", "pre-commit>=4.0", "ruff>=0.11"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x --tb=short"
