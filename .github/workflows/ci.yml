name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python 3.13 standards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install locked project
        run: uv sync --extra dev --frozen --python 3.13

      - name: Python standards (working checkout)
        run: bash _githooks/pre-commit --working

      - name: Configuration compliance
        run: uv run python _githooks/check_config_compliance.py --check

      - name: Tests
        run: uv run pytest -q

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on library files
        run: |
          shellcheck -x -S warning -e SC1091,SC2034 lib/*.sh

      - name: Run ShellCheck on stage files
        run: |
          shellcheck -x -S warning -e SC1091,SC2034 stages/*.sh

      - name: Run ShellCheck on bin scripts
        run: |
          shellcheck -x -S warning -e SC1091,SC2034 bin/*.sh bin/audiobook-convert

      - name: Run ShellCheck on installer
        run: |
          shellcheck -x -S warning -e SC1091,SC2034 install.sh
