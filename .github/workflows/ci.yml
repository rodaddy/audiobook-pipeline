name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on library files
        run: |
          shellcheck -x -S warning -e SC1091,SC2034 lib/*.sh

      - name: Run ShellCheck on stage files
        run: |
          shellcheck -x -S warning -e SC1091,SC2034 stages/*.sh

      - name: Run ShellCheck on bin scripts
        run: |
          shellcheck -x -S warning -e SC1091,SC2034 bin/*.sh bin/audiobook-convert

      - name: Run ShellCheck on installer
        run: |
          shellcheck -x -S warning -e SC1091,SC2034 install.sh

  test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/ -v

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Install mypy
        run: uv pip install mypy

      - name: Run mypy
        run: uv run mypy src/ --ignore-missing-imports
